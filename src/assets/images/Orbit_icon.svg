<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Orbit Chat App Icon</title>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0A1628"/>

  <!-- Outer subtle border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#20C997" stroke-width="1.5" opacity="0.2"/>

  <!-- Orbit ellipse ring — outer glow layer -->
  <ellipse cx="256" cy="256" rx="180" ry="72" fill="none" stroke="#20C997" stroke-width="12" opacity="0.08"/>

  <!-- Orbit ellipse ring — mid glow layer -->
  <ellipse cx="256" cy="256" rx="180" ry="72" fill="none" stroke="#20C997" stroke-width="6" opacity="0.18"/>

  <!-- Orbit ellipse ring — main stroke -->
  <ellipse cx="256" cy="256" rx="180" ry="72" fill="none" stroke="#20C997" stroke-width="2.5" opacity="0.75"/>

  <!-- Orbit ellipse ring — dashed detail -->
  <ellipse cx="256" cy="256" rx="180" ry="72" fill="none" stroke="#63EDCA" stroke-width="1" opacity="0.3" stroke-dasharray="12 8"/>

  <!-- Main center chat bubble -->
  <circle cx="256" cy="256" r="88" fill="#0E2A1F"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#20C997" stroke-width="3"/>

  <!-- Glow ring around bubble -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#20C997" stroke-width="8" opacity="0.1"/>

  <!-- Chat lines inside bubble -->
  <rect x="210" y="228" width="92" height="10" rx="5" fill="#20C997" opacity="0.9"/>
  <rect x="210" y="250" width="68" height="10" rx="5" fill="#20C997" opacity="0.65"/>
  <rect x="210" y="272" width="80" height="10" rx="5" fill="#20C997" opacity="0.45"/>

  <!-- Chat bubble tail -->
  <polygon points="224,340 196,384 268,340" fill="#0E2A1F"/>
  <line x1="224" y1="341" x2="196" y2="384" stroke="#20C997" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="341" x2="196" y2="384" stroke="#20C997" stroke-width="3" stroke-linecap="round"/>

  <!-- Orbiting large dot — right -->
  <circle cx="436" cy="256" r="22" fill="#0E2A1F" stroke="#20C997" stroke-width="2.5"/>
  <circle cx="436" cy="256" r="10" fill="#20C997" opacity="0.9"/>
  <circle cx="436" cy="256" r="22" fill="none" stroke="#63EDCA" stroke-width="6" opacity="0.12"/>

  <!-- Orbiting small dot — left -->
  <circle cx="76" cy="256" r="14" fill="#0E2A1F" stroke="#20C997" stroke-width="2"/>
  <circle cx="76" cy="256" r="6" fill="#20C997" opacity="0.7"/>

  <!-- Orbiting tiny dot — top -->
  <circle cx="256" cy="184" r="9" fill="#20C997" opacity="0.5"/>

  <!-- Orbiting tiny dot — bottom -->
  <circle cx="256" cy="328" r="6" fill="#20C997" opacity="0.3"/>

  <!-- Speed trail lines behind right dot -->
  <line x1="390" y1="244" x2="416" y2="244" stroke="#20C997" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="394" y1="256" x2="414" y2="256" stroke="#20C997" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <line x1="390" y1="268" x2="416" y2="268" stroke="#20C997" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
